<!DOCTYPE html>
<html lang="it">
<head><meta charset="utf-8" /><title>Stazione di ABBADIA LARIANA</title></head>
<body>
<!-- REAL SKELETON, real-because-structural — the page shell (table/thead/notices markup) is
     byte-for-byte the same template every iechub board page uses; only the row set is empty,
     which is a normal, verified state for a quiet station outside the ~90-minute window
     (ARCHITECTURE 2.2: "an empty board at night is a normal state"). Required parser test
     case: empty station. -->
<table class="monitors" id="monitor" aria-label="testo">
<thead>
<tr>
    <th class="Vettore_classth" id="HVettore" scope="col">Vettore</th>
    <th class="Categoria_classth" id="HCategoria" scope="col">Categoria</th>
    <th class="Treno_classth" id="HTreno" scope="col">Treno</th>
    <th class="Stazione_classth" id="HStazione" scope="col">Destinazione</th>
    <th class="Orario_classth" id="HOrario" scope="col">Orario</th>
    <th class="Ritardo_classth" id="HRitardo" scope="col">Ritardo</th>
    <th class="Binario_classth" id="HBinario" scope="col">Binario</th>
    <th class="ExLampeggio_classth" id="HInArrivo" scope="col">In partenza</th>
    <th class="Dettagli_classth" id="HDettagli" scope="col">Informazioni</th>
</tr>
</thead>
<tbody id="bodyTabId">
</tbody>
</table>
</body>
</html>
